services:
  db:
    image: postgres:18-alpine
    container_name: glassabbey-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: glassabbey
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass

    volumes:
      - pg-data:/var/lib/postgresql/data



  redis:
    image: redis:8-alpine
    container_name: glassabbey-redis
    restart: unless-stopped
    ports:
        - "6379:6379"
    command: redis-server --save 60 1
    volumes:
        - redis-data:/data

volumes:
  pg-data:
  redis-data: