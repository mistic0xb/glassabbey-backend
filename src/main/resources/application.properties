spring.application.name=glassabbey-backend
# Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/glassabbey}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
# Show or not log for each sql query
spring.jpa.show-sql=false
# Hibernate ddl auto (create, create-drop, update): with "update" the database
spring.jpa.hibernate.ddl-auto=validate

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Allows Hibernate to generate SQL optimized for a particular DBMS
spring.jpa.properties.hibernate.format_sql=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#jwt (openssl rand -base64 32)
jwt.secret=${JWT_SECRET}
jwt.expiration=604800000

# generate with: openssl rand -hex 32
nwc.encryption.key=${NWC_ENCRYPTION_KEY}

auction.submission-fee-sats=${AUCTION_SUBMISSION_FEE_SATS:100}

