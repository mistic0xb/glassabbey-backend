<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlassAbbey // TERMINAL_ACTIVE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "JetBrains Mono", "Fira Code", "Courier New", Courier, monospace;
        }

        body {
            background-color: #050505;
            color: #00ff66;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .terminal {
            width: 100%;
            max-width: 580px;
            border: 1px solid #00ff66;
            background: #000000;
            padding: 1.5rem;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.15);
        }

        .header {
            border-bottom: 1px dashed #00ff66;
            padding-bottom: 0.75rem;
            margin-bottom: 1.25rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #00ff66;
            box-shadow: 0 0 8px #00ff66;
            animation: blink 1s step-end infinite;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: normal;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            color: #00cc52;
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 1.25rem;
        }

        .prompt-line {
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            word-break: break-all;
        }

        .prompt-line span {
            color: #008833;
        }

        .actions {
            display: flex;
            gap: 1rem;
            border-top: 1px dashed #00ff66;
            padding-top: 1.25rem;
        }

        .btn {
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 6px 12px;
            font-size: 0.8rem;
            text-decoration: none;
            background: transparent;
            transition: all 0.15s ease;
        }

        .btn:hover {
            background: #00ff66;
            color: #000000;
            box-shadow: 0 0 10px #00ff66;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header">
        <span>SYS_ID: GLASSABBEY-API</span>
        <span>PORT: 8080</span>
    </div>

    <div class="status">
        <span class="dot"></span>
        <span>STATUS: 200_OK // BACKEND_ONLINE</span>
    </div>

    <h1>> DEAD END</h1>
    <p>> Congrats, you broke through the matrix and landed in the backend. It's pitch black, you are likely to be eaten by a null pointer exception.</p>

    <div class="prompt-line">
        made by <a href="https://x.com/mistic_twt" target="_blank" style="color: #00ff66; text-decoration: underline;">@mist</a>
    </div>

    <div class="actions">
        <a href="/" class="btn">[ RETURN_TO_UI ]</a>
    </div>
</div>

</body>
</html>
